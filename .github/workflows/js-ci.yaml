name: JS CI

on:
  push:
    branches: [icechunk-js]
    paths:
      - "icechunk-js/**"
      - "icechunk/flatbuffers/**"
      - "icechunk-python/tests/data/**"
      - ".github/workflows/js-ci.yaml"
  pull_request:
    branches: [icechunk-js]
    paths:
      - "icechunk-js/**"
      - "icechunk/flatbuffers/**"
      - "icechunk-python/tests/data/**"
      - ".github/workflows/js-ci.yaml"

defaults:
  run:
    working-directory: icechunk-js

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18, 20, 22]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"
          cache-dependency-path: icechunk-js/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: icechunk-js/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

  typecheck:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: icechunk-js/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

  schema-check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: icechunk-js/package-lock.json

      - name: Install FlatBuffers compiler
        run: |
          curl -L https://github.com/google/flatbuffers/releases/download/v25.2.10/Linux.flatc.binary.clang++-18.zip -o flatc.zip
          unzip flatc.zip -d /usr/local/bin/
          chmod +x /usr/local/bin/flatc

      - name: Install dependencies
        run: npm ci

      - name: Check FlatBuffers generated code is up to date
        run: npm run check:fbs
