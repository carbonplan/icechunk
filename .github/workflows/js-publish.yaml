name: JS Publish to npm

on:
  workflow_dispatch:
  # Disabled: triggers on any monorepo release tag, not just JS releases.
  # Re-enable with proper tag filtering (e.g., tags: ['js-v*']) when ready.
  # release:
  #   types: [published]

defaults:
  run:
    working-directory: icechunk-js

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: icechunk-js/package-lock.json
          registry-url: https://registry.npmjs.org

      - name: Set version from release tag
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          echo "Publishing version: $VERSION"
          npm version "$VERSION" --no-git-tag-version

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Publish to npm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
